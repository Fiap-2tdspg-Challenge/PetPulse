# =============================================================
# PetPulse – Challenge FIAP 2026
# Serviços: Oracle XE 21c + MongoDB 7 + PetPulse API (.NET 10)
# Uso: cp .env.example .env  (preencha as senhas)  e depois  docker compose up -d
# =============================================================

services:

  # -----------------------------------------------------------
  # Banco de dados Oracle XE 21c (container slim)
  # -----------------------------------------------------------
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-db
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Defina ORACLE_PASSWORD no arquivo .env}
      APP_USER: petpulse
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:?Defina ORACLE_APP_PASSWORD no arquivo .env}
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - challenge_net
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 120s

  # -----------------------------------------------------------
  # MongoDB 7 – histórico de leituras da coleira IoT (NoSQL)
  # Porta 27018 no host para não conflitar com um MongoDB instalado
  # localmente (27017); dentro da rede do compose a API usa mongo:27017.
  # -----------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: petpulse-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - challenge_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5

  # -----------------------------------------------------------
  # PetPulse API – .NET 10
  # -----------------------------------------------------------
  petpulse-api:
    build:
      context: .
      dockerfile: dockerfile
    image: pietrowilhelm/challenge-clyvo-vet:latest
    container_name: petpulse-api
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__PetPulseOracle=Data Source=oracle-db:1521/XEPDB1;User ID=petpulse;Password=${ORACLE_APP_PASSWORD:?Defina ORACLE_APP_PASSWORD no arquivo .env};
      - Jwt__Key=${JWT_KEY:?Defina JWT_KEY no arquivo .env}
      - ConnectionStrings__PetPulseMongo=mongodb://mongo:27017
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      oracle-db:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - challenge_net
    restart: on-failure

# ---------------------------------------------------------------
# Volume nomeado para persistência dos dados do Oracle
# ---------------------------------------------------------------
volumes:
  oracle_data:
    name: oracle_data
  mongo_data:
    name: mongo_data

# ---------------------------------------------------------------
# Rede interna dos serviços
# ---------------------------------------------------------------
networks:
  challenge_net:
    name: challenge_net
